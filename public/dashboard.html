<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — DeskWarriorFit</title>
  <meta name="description" content="Your daily desk-warrior challenges, streak, and progress tracker.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: #0d1209;
      color: #ede8df;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; }

    /* ── Nav ── */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background-color: rgba(13,18,9,0.93);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #2d3d21;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
    }
    .nav-logo-badge {
      width: 32px; height: 32px;
      background-color: #c8f23a; border-radius: 7px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nav-logo-badge span {
      font-family: 'DM Mono', monospace; font-weight: 500;
      font-size: 13px; color: #0d1209;
    }
    .nav-logo-name {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700; font-size: 17px;
      letter-spacing: -0.02em; color: #ede8df;
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .user-email {
      font-family: 'DM Mono', monospace; font-size: 12px;
      color: #7a9464; display: none;
    }
    @media (min-width: 560px) { .user-email { display: block; } }
    .btn-logout {
      font-size: 13px; font-weight: 600;
      color: #7a9464; background: none; border: 1px solid #2d3d21;
      border-radius: 8px; padding: 7px 14px; cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-logout:hover { color: #ede8df; border-color: #7a9464; }

    /* ── Page content ── */
    .page { max-width: 1200px; margin: 0 auto; padding: clamp(32px, 5vw, 56px) 24px; }

    /* ── Greeting & date ── */
    .greeting-row {
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 36px;
    }
    .greeting-label {
      font-family: 'DM Mono', monospace; font-size: 11px;
      letter-spacing: 0.14em; color: #c8f23a;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .greeting-h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 900; letter-spacing: -0.025em;
      line-height: 1.05;
    }
    .today-date {
      font-family: 'DM Mono', monospace; font-size: 12px;
      color: #7a9464; text-align: right;
    }

    /* ── Stat strip ── */
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px; margin-bottom: 40px;
    }
    @media (max-width: 560px) { .stat-strip { grid-template-columns: 1fr 1fr; } }
    .stat-tile {
      background-color: #141a0f;
      border: 1px solid #2d3d21; border-radius: 14px;
      padding: 20px 18px;
    }
    .stat-tile-label {
      font-family: 'DM Mono', monospace; font-size: 10px;
      letter-spacing: 0.12em; color: #7a9464;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .stat-tile-value {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 36px; font-weight: 900;
      letter-spacing: -0.03em; line-height: 1;
      color: #c8f23a;
    }
    .stat-tile-sub {
      font-size: 12px; color: #7a9464; margin-top: 4px;
    }

    /* ── Section heading ── */
    .section-label {
      font-family: 'DM Mono', monospace; font-size: 11px;
      letter-spacing: 0.14em; color: #c8f23a;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .section-h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 900; letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    /* ── Challenge cards ── */
    .challenges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px; margin-bottom: 48px;
    }
    .challenge-card {
      background-color: #141a0f;
      border: 1px solid #2d3d21; border-radius: 16px;
      padding: 24px; display: flex;
      flex-direction: column; gap: 14px;
      transition: border-color 0.2s;
    }
    .challenge-card.done {
      border-color: #c8f23a;
      opacity: 0.75;
    }
    .challenge-card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .challenge-category {
      font-family: 'DM Mono', monospace; font-size: 10px;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 4px; font-weight: 500;
    }
    .cat-move    { background-color: #1e3a14; color: #c8f23a; }
    .cat-recover { background-color: #1a2e3a; color: #7ac8f2; }
    .cat-fuel    { background-color: #3a2e14; color: #f2c87a; }
    .challenge-points {
      font-family: 'DM Mono', monospace; font-size: 12px;
      color: #7a9464;
    }
    .challenge-title {
      font-size: 17px; font-weight: 700;
      letter-spacing: -0.01em; line-height: 1.3;
    }
    .challenge-desc {
      font-size: 14px; line-height: 1.65; color: #7a9464;
    }
    .complete-btn {
      align-self: flex-start;
      background-color: transparent;
      border: 1px solid #2d3d21; border-radius: 8px;
      padding: 9px 18px; font-size: 13px; font-weight: 700;
      color: #ede8df; cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
      display: flex; align-items: center; gap: 8px;
    }
    .complete-btn:hover {
      background-color: #c8f23a; border-color: #c8f23a; color: #0d1209;
    }
    .complete-btn.done {
      background-color: #1e3a14; border-color: #c8f23a; color: #c8f23a;
      cursor: default;
    }
    .complete-btn:disabled { cursor: default; }

    /* ── Recent activity ── */
    .activity-list { display: flex; flex-direction: column; gap: 12px; }
    .activity-item {
      display: flex; align-items: center; gap: 16px;
      background-color: #141a0f;
      border: 1px solid #2d3d21; border-radius: 12px;
      padding: 14px 18px;
    }
    .activity-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background-color: #c8f23a; flex-shrink: 0;
    }
    .activity-title { font-size: 14px; font-weight: 600; flex: 1; }
    .activity-time {
      font-family: 'DM Mono', monospace; font-size: 11px;
      color: #7a9464; white-space: nowrap;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      background-color: #141a0f;
      border: 1px dashed #2d3d21; border-radius: 16px;
      color: #7a9464;
    }
    .empty-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 600; color: #ede8df; margin-bottom: 6px; }

    /* ── Loading skeleton ── */
    .loading-text {
      color: #7a9464; font-family: 'DM Mono', monospace;
      font-size: 13px; padding: 32px 0;
    }
  </style>
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <div class="nav-logo-badge"><span>DW</span></div>
        <span class="nav-logo-name">DeskWarriorFit</span>
      </a>
      <div class="nav-right">
        <span class="user-email" id="userEmail"></span>
        <button class="btn-logout" onclick="handleLogout()">Log Out</button>
      </div>
    </div>
  </nav>

  <!-- ── Dashboard ── -->
  <div class="page">

    <!-- Greeting -->
    <div class="greeting-row">
      <div>
        <div class="greeting-label">Your dashboard</div>
        <h1 class="greeting-h1" id="greeting">Good morning, Warrior.</h1>
      </div>
      <div class="today-date" id="todayDate"></div>
    </div>

    <!-- Stats strip -->
    <div class="stat-strip">
      <div class="stat-tile">
        <div class="stat-tile-label">Day Streak</div>
        <div class="stat-tile-value" id="statStreak">—</div>
        <div class="stat-tile-sub">consecutive days</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Today</div>
        <div class="stat-tile-value" id="statToday">—</div>
        <div class="stat-tile-sub">challenges done</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Total Points</div>
        <div class="stat-tile-value" id="statPoints">—</div>
        <div class="stat-tile-sub">points earned</div>
      </div>
    </div>

    <!-- Today's challenges -->
    <div class="section-label">Today's challenges</div>
    <h2 class="section-h2" id="challengeHeading">Loading…</h2>
    <div class="challenges-grid" id="challengesGrid">
      <p class="loading-text">Fetching your challenges…</p>
    </div>

    <!-- Recent activity -->
    <div id="recentSection" style="display:none">
      <div class="section-label">Recent activity</div>
      <div class="activity-list" id="activityList"></div>
    </div>

  </div>

  <script src="/api/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = window.supabase;
    const sb = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    let currentUser = null;
    let todayCompletedIds = new Set();

    // ── Auth guard ──
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = '/auth.html';
        return;
      }
      currentUser = session.user;
      document.getElementById('userEmail').textContent = currentUser.email;

      setGreeting();
      setDate();
      await Promise.all([loadProgress(), loadChallenges()]);
    }

    function setGreeting() {
      const hour = new Date().getHours();
      const time = hour < 12 ? 'morning' : hour < 17 ? 'afternoon' : 'evening';
      document.getElementById('greeting').textContent = `Good ${time}, Warrior.`;
    }

    function setDate() {
      const d = new Date();
      const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('todayDate').textContent = d.toLocaleDateString('en-GB', opts);
    }

    // ── Load progress ──
    async function loadProgress() {
      const { data: { session } } = await sb.auth.getSession();
      const token = session.access_token;

      const res = await fetch('/api/progress', {
        headers: { Authorization: 'Bearer ' + token },
      });
      if (!res.ok) return;
      const { progress, streak } = await res.json();

      document.getElementById('statStreak').textContent = streak;

      // Today's completions
      const today = new Date().toISOString().split('T')[0];
      const todayRows = progress.filter(r => r.completed_at.startsWith(today));
      todayRows.forEach(r => todayCompletedIds.add(r.challenge_id));

      document.getElementById('statToday').textContent = todayRows.length;

      // Total points
      const totalPoints = progress.reduce((sum, r) => sum + (r.challenges?.points || 0), 0);
      document.getElementById('statPoints').textContent = totalPoints;

      // Recent activity (last 10)
      const recent = progress.slice(0, 10);
      if (recent.length > 0) {
        document.getElementById('recentSection').style.display = '';
        const list = document.getElementById('activityList');
        list.innerHTML = recent.map(r => {
          const when = new Date(r.completed_at);
          const rel = formatRelativeTime(when);
          return `
            <div class="activity-item">
              <div class="activity-dot"></div>
              <span class="activity-title">${escHtml(r.challenges?.title || 'Challenge')}</span>
              <span class="activity-time">${rel}</span>
            </div>`;
        }).join('');
      }
    }

    // ── Load today's challenges ──
    async function loadChallenges() {
      const res = await fetch('/api/challenges/today');
      const grid = document.getElementById('challengesGrid');

      if (!res.ok) {
        grid.innerHTML = '<p class="loading-text">Could not load challenges. Try refreshing.</p>';
        return;
      }

      const { challenges } = await res.json();

      if (!challenges || challenges.length === 0) {
        document.getElementById('challengeHeading').textContent = 'Rest day — well earned.';
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">😴</div>
            <div class="empty-title">No challenges today</div>
            <p>Today is your rest day. Stay hydrated and get good sleep.</p>
          </div>`;
        return;
      }

      const dayName = new Date().toLocaleDateString('en-GB', { weekday: 'long' });
      document.getElementById('challengeHeading').textContent = `${dayName}'s workout`;

      grid.innerHTML = challenges.map(c => {
        const done = todayCompletedIds.has(c.id);
        return `
          <div class="challenge-card ${done ? 'done' : ''}" id="card-${c.id}">
            <div class="challenge-card-top">
              <span class="challenge-category cat-${c.category}">${c.category}</span>
              <span class="challenge-points">+${c.points} pts</span>
            </div>
            <div class="challenge-title">${escHtml(c.title)}</div>
            <div class="challenge-desc">${escHtml(c.description || '')}</div>
            <button
              class="complete-btn ${done ? 'done' : ''}"
              id="btn-${c.id}"
              onclick="markComplete('${c.id}', ${c.points})"
              ${done ? 'disabled' : ''}
            >
              ${done ? '✓ Done' : 'Mark complete'}
            </button>
          </div>`;
      }).join('');
    }

    // ── Mark a challenge complete ──
    async function markComplete(challengeId, points) {
      const btn = document.getElementById(`btn-${challengeId}`);
      btn.disabled = true;
      btn.textContent = 'Saving…';

      const { data: { session } } = await sb.auth.getSession();
      const token = session.access_token;

      const res = await fetch('/api/progress', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token,
        },
        body: JSON.stringify({ challenge_id: challengeId }),
      });

      if (res.ok || res.status === 409) {
        todayCompletedIds.add(challengeId);
        btn.textContent = '✓ Done';
        btn.classList.add('done');
        document.getElementById(`card-${challengeId}`).classList.add('done');

        // Update today stat
        const todayStat = document.getElementById('statToday');
        todayStat.textContent = todayCompletedIds.size;

        // Update points
        if (res.ok) {
          const pointsEl = document.getElementById('statPoints');
          pointsEl.textContent = parseInt(pointsEl.textContent || '0', 10) + points;
        }
      } else {
        btn.disabled = false;
        btn.textContent = 'Try again';
      }
    }

    // ── Logout ──
    async function handleLogout() {
      await sb.auth.signOut();
      window.location.href = '/';
    }

    // ── Helpers ──
    function escHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatRelativeTime(date) {
      const diffMs = Date.now() - date.getTime();
      const diffMins = Math.round(diffMs / 60000);
      if (diffMins < 1)   return 'just now';
      if (diffMins < 60)  return `${diffMins}m ago`;
      const diffHrs = Math.round(diffMins / 60);
      if (diffHrs < 24)   return `${diffHrs}h ago`;
      const diffDays = Math.round(diffHrs / 24);
      return `${diffDays}d ago`;
    }

    init();
  </script>

</body>
</html>
