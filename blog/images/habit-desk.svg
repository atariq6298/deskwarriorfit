<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a2e10"/>
      <stop offset="100%" stop-color="#0d1209"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8f23a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8f23a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Ambient glow behind monitor -->
  <ellipse cx="420" cy="200" rx="220" ry="120" fill="url(#glow)" filter="url(#blur12)"/>
  
  <!-- Back wall panels -->
  <rect x="0" y="0" width="1200" height="450" fill="#0d1209"/>
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#2d3d21" stroke-width="1"/>
  <!-- Subtle wall grid -->
  <g stroke="#1a2416" stroke-width="0.5" opacity="0.4">
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="800" y1="0" x2="800" y2="450"/>
    <line x1="1000" y1="0" x2="1000" y2="450"/>
  </g>
  
  <!-- Window (left wall) -->
  <rect x="60" y="60" width="180" height="280" rx="4" fill="#0a1508" stroke="#2d3d21" stroke-width="2"/>
  <rect x="60" y="60" width="180" height="280" rx="4" fill="#131f0d" opacity="0.8"/>
  <!-- Window cross bar -->
  <line x1="150" y1="60" x2="150" y2="340" stroke="#2d3d21" stroke-width="2"/>
  <line x1="60" y1="200" x2="240" y2="200" stroke="#2d3d21" stroke-width="2"/>
  <!-- Window glow - moonlight -->
  <rect x="62" y="62" width="87" height="137" fill="#1e3a28" opacity="0.3"/>
  
  <!-- Desk surface -->
  <rect x="180" y="430" width="900" height="28" rx="4" fill="#1a2612" stroke="#2d3d21" stroke-width="1.5"/>
  <!-- Desk legs -->
  <rect x="220" y="458" width="18" height="180" rx="2" fill="#141a0f"/>
  <rect x="1042" y="458" width="18" height="180" rx="2" fill="#141a0f"/>
  <!-- Floor -->
  <rect x="0" y="490" width="1200" height="185" fill="#0a0f07"/>
  <line x1="0" y1="492" x2="1200" y2="492" stroke="#1a2416" stroke-width="1"/>
  
  <!-- External monitor (main) -->
  <rect x="300" y="200" width="360" height="210" rx="8" fill="#080d06" stroke="#2d3d21" stroke-width="2.5" filter="url(#shadow)"/>
  <!-- Monitor screen content -->
  <rect x="306" y="206" width="348" height="198" rx="5" fill="#0f1a0a"/>
  <!-- Screen glow -->
  <rect x="306" y="206" width="348" height="198" rx="5" fill="#c8f23a" opacity="0.04"/>
  <!-- Code lines on screen -->
  <g fill="#c8f23a" opacity="0.35">
    <rect x="320" y="225" width="120" height="4" rx="2"/>
    <rect x="320" y="237" width="80" height="4" rx="2"/>
    <rect x="332" y="249" width="100" height="4" rx="2"/>
    <rect x="332" y="261" width="60" height="4" rx="2"/>
    <rect x="320" y="273" width="90" height="4" rx="2"/>
    <rect x="332" y="285" width="110" height="4" rx="2"/>
    <rect x="320" y="297" width="70" height="4" rx="2"/>
    <rect x="332" y="309" width="95" height="4" rx="2"/>
    <rect x="320" y="321" width="45" height="4" rx="2"/>
    <rect x="332" y="333" width="130" height="4" rx="2"/>
    <rect x="320" y="345" width="85" height="4" rx="2"/>
    <rect x="332" y="357" width="55" height="4" rx="2"/>
    <rect x="320" y="369" width="115" height="4" rx="2"/>
  </g>
  <!-- Monitor stand -->
  <rect x="470" y="410" width="20" height="20" rx="2" fill="#1a2612" stroke="#2d3d21" stroke-width="1.5"/>
  <rect x="450" y="428" width="60" height="6" rx="3" fill="#1a2612" stroke="#2d3d21" stroke-width="1.5"/>
  <!-- Monitor power LED -->
  <circle cx="480" cy="405" r="3" fill="#c8f23a" opacity="0.8"/>
  
  <!-- Laptop (smaller, to the right) -->
  <rect x="700" y="350" width="240" height="150" rx="6" fill="#080d06" stroke="#2d3d21" stroke-width="2" filter="url(#shadow)"/>
  <rect x="706" y="356" width="228" height="138" rx="4" fill="#0f1a0a"/>
  <!-- Laptop screen glow -->
  <rect x="706" y="356" width="228" height="138" rx="4" fill="#7a9464" opacity="0.06"/>
  <!-- Keyboard base -->
  <rect x="700" y="426" width="240" height="8" rx="2" fill="#141a0f" stroke="#2d3d21" stroke-width="1"/>
  <!-- Keyboard keys suggestion -->
  <g fill="#1e2a14" stroke="#2d3d21" stroke-width="0.5">
    <rect x="712" y="434" width="216" height="30" rx="3"/>
  </g>
  
  <!-- Person (seated, good posture) -->
  <!-- Chair back -->
  <rect x="575" y="280" width="60" height="160" rx="25" fill="#141a0f" stroke="#2d3d21" stroke-width="1.5"/>
  <!-- Chair seat -->
  <rect x="548" y="420" width="115" height="20" rx="8" fill="#141a0f" stroke="#2d3d21" stroke-width="1.5"/>
  <!-- Chair legs -->
  <line x1="560" y1="440" x2="545" y2="490" stroke="#1a2612" stroke-width="5" stroke-linecap="round"/>
  <line x1="648" y1="440" x2="663" y2="490" stroke="#1a2612" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Person body -->
  <!-- Torso -->
  <ellipse cx="605" cy="360" rx="35" ry="55" fill="#2d3d21"/>
  <!-- Neck -->
  <rect x="596" y="300" width="18" height="25" rx="8" fill="#7a9464"/>
  <!-- Head -->
  <ellipse cx="605" cy="285" rx="28" ry="32" fill="#7a9464"/>
  <!-- Hair -->
  <ellipse cx="605" cy="265" rx="28" ry="18" fill="#3d5230"/>
  <!-- Face highlight -->
  <ellipse cx="600" cy="285" rx="14" ry="16" fill="#8aaa74" opacity="0.4"/>
  <!-- Ears -->
  <ellipse cx="577" cy="287" rx="5" ry="7" fill="#6a8454"/>
  <ellipse cx="633" cy="287" rx="5" ry="7" fill="#6a8454"/>
  
  <!-- Arms (typing position) -->
  <!-- Left arm -->
  <path d="M 580 340 Q 540 380 500 415" stroke="#2d3d21" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 580 340 Q 540 380 500 415" stroke="#3d5230" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Right arm -->
  <path d="M 628 340 Q 668 380 708 415" stroke="#2d3d21" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 628 340 Q 668 380 708 415" stroke="#3d5230" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Hands -->
  <ellipse cx="500" cy="420" rx="18" ry="10" fill="#6a8454"/>
  <ellipse cx="708" cy="420" rx="18" ry="10" fill="#6a8454"/>
  
  <!-- Posture alignment indicator (subtle green line) -->
  <line x1="605" y1="260" x2="605" y2="435" stroke="#c8f23a" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.25"/>
  
  <!-- Desk items -->
  <!-- Coffee mug -->
  <rect x="940" y="400" width="36" height="32" rx="4" fill="#141a0f" stroke="#2d3d21" stroke-width="1.5"/>
  <path d="M 976 408 Q 992 408 992 420 Q 992 432 976 432" stroke="#2d3d21" stroke-width="2" fill="none"/>
  <!-- Steam -->
  <path d="M 950 395 Q 953 385 950 378" stroke="#7a9464" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 960 393 Q 963 383 960 376" stroke="#7a9464" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Small plant -->
  <rect x="1050" y="400" width="30" height="32" rx="3" fill="#0a1508" stroke="#2d3d21" stroke-width="1.5"/>
  <ellipse cx="1065" cy="392" rx="20" ry="16" fill="#1e3a14"/>
  <ellipse cx="1055" cy="385" rx="12" ry="10" fill="#2d4f1e"/>
  <ellipse cx="1078" cy="386" rx="12" ry="10" fill="#2d4f1e"/>
  <ellipse cx="1065" cy="378" rx="10" ry="8" fill="#3d6728"/>
  
  <!-- Subtle desk lamp -->
  <line x1="205" y1="430" x2="220" y2="350" stroke="#2d3d21" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="350" x2="280" y2="330" stroke="#2d3d21" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="280" cy="330" rx="25" ry="12" fill="#1a2612" stroke="#2d3d21" stroke-width="1.5"/>
  <!-- Lamp light cone -->
  <path d="M 268 338 L 240 430 L 310 430 Z" fill="#c8f23a" opacity="0.04"/>

  <!-- Label overlay -->
  <rect x="840" y="560" width="320" height="90" rx="12" fill="#141a0f" fill-opacity="0.9" stroke="#2d3d21" stroke-width="1.5"/>
  <text x="860" y="588" font-family="monospace" font-size="11" fill="#c8f23a" letter-spacing="2" text-transform="uppercase">ERGONOMIC SETUP</text>
  <text x="860" y="610" font-family="sans-serif" font-size="13" fill="#7a9464">Monitor at eye level · Good lumbar support</text>
  <text x="860" y="632" font-family="sans-serif" font-size="13" fill="#7a9464">Wrists neutral · Feet flat on floor</text>
</svg>