    <circle cx="205" cy="190" r="8"/>
    <circle cx="205" cy="230" r="8"/>
    <circle cx="205" cy="270" r="8"/>
    <circle cx="205" cy="310" r="8"/>
    <circle cx="205" cy="350" r="8"/>
