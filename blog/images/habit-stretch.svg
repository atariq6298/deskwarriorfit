<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#162210"/>
      <stop offset="100%" stop-color="#0a0f07"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#c8f23a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c8f23a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>

  <!-- Floor glow -->
  <ellipse cx="600" cy="620" rx="400" ry="80" fill="url(#floorGlow)"/>

  <!-- Floor line -->
  <rect x="0" y="580" width="1200" height="95" fill="#0a0f07"/>
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#1e2a14" stroke-width="2"/>

  <!-- Background grid / gym floor tiles -->
  <g stroke="#141a0f" stroke-width="1" opacity="0.6">
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="200" y1="580" x2="200" y2="675"/>
    <line x1="400" y1="580" x2="400" y2="675"/>
    <line x1="600" y1="580" x2="600" y2="675"/>
    <line x1="800" y1="580" x2="800" y2="675"/>
    <line x1="1000" y1="580" x2="1000" y2="675"/>
  </g>

  <!-- Yoga/exercise mat -->
  <ellipse cx="600" cy="575" rx="240" ry="18" fill="#1a2612" stroke="#2d3d21" stroke-width="2"/>
  <ellipse cx="600" cy="573" rx="236" ry="15" fill="#1e3018"/>
  <!-- Mat texture lines -->
  <g stroke="#2d3d21" stroke-width="0.5" opacity="0.5">
    <line x1="380" y1="570" x2="820" y2="570"/>
    <line x1="385" y1="574" x2="815" y2="574"/>
    <line x1="390" y1="578" x2="810" y2="578"/>
  </g>

  <!-- Person doing doorway chest stretch (standing, arms extended back) -->
  <!-- Shadow -->
  <ellipse cx="600" cy="573" rx="90" ry="12" fill="#000" opacity="0.4"/>

  <!-- Legs -->
  <!-- Left leg (slight lunge forward) -->
  <path d="M 580 440 L 558 575" stroke="#2d4a1e" stroke-width="28" stroke-linecap="round" fill="none"/>
  <path d="M 580 440 L 558 575" stroke="#3d6128" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Right leg (back) -->
  <path d="M 618 445 L 638 573" stroke="#2d4a1e" stroke-width="28" stroke-linecap="round" fill="none"/>
  <path d="M 618 445 L 638 573" stroke="#3d6128" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Feet -->
  <ellipse cx="554" cy="576" rx="22" ry="10" fill="#2d4a1e"/>
  <ellipse cx="642" cy="576" rx="18" ry="8" fill="#2d4a1e" transform="rotate(-10,642,576)"/>

  <!-- Torso -->
  <path d="M 565 300 Q 600 285 635 300 L 625 445 Q 600 455 575 445 Z" fill="#2d4a1e"/>
  <!-- Shirt highlight -->
  <path d="M 580 310 Q 600 302 618 310 L 614 360 Q 600 365 586 360 Z" fill="#3d6128" opacity="0.5"/>

  <!-- Arms extended back (chest stretch position) -->
  <!-- Left arm going back/out -->
  <path d="M 568 330 Q 490 360 440 390" stroke="#2d4a1e" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M 568 330 Q 490 360 440 390" stroke="#3d6128" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- Left hand/fist -->
  <ellipse cx="440" cy="390" rx="18" ry="14" fill="#5a7a44"/>

  <!-- Right arm going back/out -->
  <path d="M 632 330 Q 710 360 760 390" stroke="#2d4a1e" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M 632 330 Q 710 360 760 390" stroke="#3d6128" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- Right hand/fist -->
  <ellipse cx="760" cy="390" rx="18" ry="14" fill="#5a7a44"/>

  <!-- Neck -->
  <rect x="590" y="268" width="20" height="30" rx="9" fill="#6a9050"/>

  <!-- Head (looking slightly upward — stretch position) -->
  <ellipse cx="600" cy="248" rx="32" ry="36" fill="#7a9464"/>
  <!-- Hair -->
  <ellipse cx="600" cy="228" rx="32" ry="20" fill="#3d5230"/>
  <!-- Face -->
  <ellipse cx="595" cy="250" rx="16" ry="18" fill="#8aaa74" opacity="0.35"/>
  <!-- Eyes (closed, concentration) -->
  <path d="M 588 245 Q 593 242 598 245" stroke="#2d4a1e" stroke-width="2" fill="none"/>
  <path d="M 603 245 Q 608 242 613 245" stroke="#2d4a1e" stroke-width="2" fill="none"/>
  <!-- Ears -->
  <ellipse cx="568" cy="252" rx="6" ry="8" fill="#6a8454"/>
  <ellipse cx="632" cy="252" rx="6" ry="8" fill="#6a8454"/>

  <!-- Stretch motion arcs (indicate movement) -->
  <path d="M 450 370 Q 430 340 445 310" stroke="#c8f23a" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.4"/>
  <path d="M 750 370 Q 770 340 755 310" stroke="#c8f23a" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Chest muscle indicator arrows -->
  <path d="M 570 335 L 540 330" stroke="#c8f23a" stroke-width="1.5" fill="none" marker-end="url(#arrow)" opacity="0.5"/>
  <path d="M 628 335 L 658 330" stroke="#c8f23a" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Labels on the side -->
  <!-- Left side panel -->
  <rect x="50" y="200" width="310" height="220" rx="14" fill="#141a0f" fill-opacity="0.92" stroke="#2d3d21" stroke-width="1.5"/>
  <text x="75" y="232" font-family="monospace" font-size="11" fill="#c8f23a" letter-spacing="2">DOORWAY CHEST STRETCH</text>
  <line x1="75" y1="242" x2="340" y2="242" stroke="#2d3d21" stroke-width="1"/>
  <text x="75" y="264" font-family="sans-serif" font-size="13" fill="#7a9464">&#x2713;  Opens pec minor &amp; major</text>
  <text x="75" y="286" font-family="sans-serif" font-size="13" fill="#7a9464">&#x2713;  Counteracts forward shoulder</text>
  <text x="75" y="308" font-family="sans-serif" font-size="13" fill="#7a9464">&#x2713;  45 seconds per side</text>
  <text x="75" y="330" font-family="sans-serif" font-size="13" fill="#7a9464">&#x2713;  No equipment needed</text>
  <line x1="75" y1="345" x2="340" y2="345" stroke="#2d3d21" stroke-width="1"/>
  <text x="75" y="365" font-family="monospace" font-size="11" fill="#3d5230">Part of 8-minute weekly menu</text>
  <text x="75" y="385" font-family="monospace" font-size="11" fill="#3d5230">Beginner-friendly</text>
  <text x="75" y="405" font-family="monospace" font-size="11" fill="#3d5230">Repeat 2× per week</text>

  <!-- Right side panel -->
  <rect x="840" y="200" width="310" height="220" rx="14" fill="#141a0f" fill-opacity="0.92" stroke="#2d3d21" stroke-width="1.5"/>
  <text x="865" y="232" font-family="monospace" font-size="11" fill="#c8f23a" letter-spacing="2">MUSCLES TARGETED</text>
  <line x1="865" y1="242" x2="1130" y2="242" stroke="#2d3d21" stroke-width="1"/>
  <text x="865" y="264" font-family="sans-serif" font-size="13" fill="#ede8df">Pectoralis major</text>
  <rect x="865" y="275" width="180" height="5" rx="2" fill="#c8f23a" opacity="0.8"/>
  <text x="865" y="300" font-family="sans-serif" font-size="13" fill="#ede8df">Anterior deltoid</text>
  <rect x="865" y="311" width="140" height="5" rx="2" fill="#c8f23a" opacity="0.65"/>
  <text x="865" y="336" font-family="sans-serif" font-size="13" fill="#ede8df">Biceps (short head)</text>
  <rect x="865" y="347" width="110" height="5" rx="2" fill="#c8f23a" opacity="0.5"/>
  <text x="865" y="372" font-family="sans-serif" font-size="13" fill="#ede8df">Intercostals</text>
  <rect x="865" y="383" width="80" height="5" rx="2" fill="#c8f23a" opacity="0.35"/>
</svg>