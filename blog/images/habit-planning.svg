  <!-- Left page header -->
  <text x="220" y="120" font-family="Georgia,serif" font-size="18" fill="#2d4a1e" font-weight="bold">My Posture Habit Plan</text>

  <!-- Handwritten-style text (left page) -->
  <text x="220" y="155" font-family="Georgia,serif" font-size="14" fill="#3d3020">TRIGGER:</text>
  <text x="220" y="177" font-family="Georgia,serif" font-size="13" fill="#4a3d28">Monday after closing weekly</text>
  <text x="220" y="199" font-family="Georgia,serif" font-size="13" fill="#4a3d28">planning doc ~9:30am</text>

  <line x1="220" y1="216" x2="520" y2="216" stroke="#c8f23a" stroke-width="2" opacity="0.6"/>

  <text x="220" y="238" font-family="Georgia,serif" font-size="14" fill="#3d3020">ACTION (tiny version):</text>
  <text x="220" y="260" font-family="Georgia,serif" font-size="13" fill="#4a3d28">1 doorway chest stretch/side</text>
  <text x="220" y="282" font-family="Georgia,serif" font-size="13" fill="#4a3d28">+ 10 wall angels</text>
  <text x="220" y="304" font-family="Georgia,serif" font-size="13" fill="#4a3d28">(5 min max)</text>

  <line x1="220" y1="320" x2="520" y2="320" stroke="#c8f23a" stroke-width="2" opacity="0.6"/>

  <text x="220" y="342" font-family="Georgia,serif" font-size="14" fill="#3d3020">FULL VERSION (good weeks):</text>
  <text x="220" y="364" font-family="Georgia,serif" font-size="13" fill="#4a3d28">+ Chin tucks x10</text>
  <text x="220" y="386" font-family="Georgia,serif" font-size="13" fill="#4a3d28">+ Hip flexor stretch</text>
  <text x="220" y="408" font-family="Georgia,serif" font-size="13" fill="#4a3d28">+ Glute squeeze x10</text>
  <text x="220" y="430" font-family="Georgia,serif" font-size="13" fill="#4a3d28">(8 min total)</text>

  <line x1="220" y1="447" x2="520" y2="447" stroke="#c8f23a" stroke-width="2" opacity="0.6"/>

  <text x="220" y="469" font-family="Georgia,serif" font-size="14" fill="#3d3020">TRACKER:</text>
  <!-- Mini checkboxes -->
  <rect x="220" y="478" width="14" height="14" rx="2" fill="none" stroke="#5a7a44" stroke-width="1.5"/>
  <path d="M 222 485 L 226 490 L 233 481" stroke="#5a7a44" stroke-width="2" fill="none"/>
  <text x="242" y="491" font-family="Georgia,serif" font-size="13" fill="#4a3d28">W1 — Mon check &#x2713;</text>

  <rect x="220" y="500" width="14" height="14" rx="2" fill="none" stroke="#5a7a44" stroke-width="1.5"/>
  <path d="M 222 507 L 226 512 L 233 503" stroke="#5a7a44" stroke-width="2" fill="none"/>
  <text x="242" y="513" font-family="Georgia,serif" font-size="13" fill="#4a3d28">W1 — Wed check &#x2713;</text>

  <rect x="220" y="522" width="14" height="14" rx="2" fill="none" stroke="#9a9090" stroke-width="1.5"/>
  <text x="242" y="535" font-family="Georgia,serif" font-size="13" fill="#9a8878">W2 — add 2nd session</text>

