  <!-- Right page header -->
  <text x="610" y="120" font-family="Georgia,serif" font-size="18" fill="#2d4a1e" font-weight="bold">4-Week Progression</text>

  <!-- Week blocks -->
  <!-- Week 1 -->
  <rect x="608" y="148" width="314" height="82" rx="6" fill="#e8efe0" stroke="#b0c890" stroke-width="1"/>
  <text x="620" y="170" font-family="Georgia,serif" font-size="13" fill="#2d4a1e" font-weight="bold">Week 1 — Prove it fits</text>
  <text x="620" y="188" font-family="Georgia,serif" font-size="12" fill="#4a6030">1 session · tiny action only</text>
  <text x="620" y="206" font-family="Georgia,serif" font-size="12" fill="#4a6030">Goal: trigger &#x2192; action &#x2192; track once</text>
  <text x="620" y="224" font-family="Georgia,serif" font-size="11" fill="#6a8040" font-style="italic">If it felt easy, it worked ✓</text>

  <!-- Week 2 -->
  <rect x="608" y="242" width="314" height="82" rx="6" fill="#e8efe0" stroke="#b0c890" stroke-width="1"/>
  <text x="620" y="264" font-family="Georgia,serif" font-size="13" fill="#2d4a1e" font-weight="bold">Week 2 — Add a session</text>
  <text x="620" y="282" font-family="Georgia,serif" font-size="12" fill="#4a6030">2 sessions · still tiny</text>
  <text x="620" y="300" font-family="Georgia,serif" font-size="12" fill="#4a6030">Pick a different trigger day</text>
  <text x="620" y="318" font-family="Georgia,serif" font-size="11" fill="#6a8040" font-style="italic">Mon + Wed works great</text>

  <!-- Week 3 -->
  <rect x="608" y="336" width="314" height="82" rx="6" fill="#eaf5e0" stroke="#8aba50" stroke-width="1.5"/>
  <text x="620" y="358" font-family="Georgia,serif" font-size="13" fill="#1e3a14" font-weight="bold">Week 3 — Expand menu</text>
  <text x="620" y="376" font-family="Georgia,serif" font-size="12" fill="#3a5020">2 sessions · add 1 new drill each</text>
  <text x="620" y="394" font-family="Georgia,serif" font-size="12" fill="#3a5020">Try hip flexor or chin tucks</text>
  <text x="620" y="412" font-family="Georgia,serif" font-size="11" fill="#5a7030" font-style="italic">Should feel like 6–8 mins now</text>

  <!-- Week 4 -->
  <rect x="608" y="430" width="314" height="82" rx="6" fill="#daf0c0" stroke="#6ab030" stroke-width="2"/>
  <text x="620" y="452" font-family="Georgia,serif" font-size="13" fill="#1a3010" font-weight="bold">Week 4 — Lock the identity</text>
  <text x="620" y="470" font-family="Georgia,serif" font-size="12" fill="#2a4818">Review tracker — 3/4 weeks?</text>
  <text x="620" y="488" font-family="Georgia,serif" font-size="12" fill="#2a4818">You are now "someone who does this"</text>
  <text x="620" y="506" font-family="Georgia,serif" font-size="11" fill="#4a6828" font-style="italic">Scale up or maintain ✓</text>

