  <text x="490" y="120" font-family="sans-serif" font-size="24" fill="#c8a020" opacity="0.7">&#x2605;</text>
  <text x="465" y="145" font-family="Georgia,serif" font-size="11" fill="#8a7040" font-style="italic">start small!</text>

