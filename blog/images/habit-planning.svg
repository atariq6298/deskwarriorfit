      <stop offset="0%" stop-color="#141e0e"/>
      <stop offset="100%" stop-color="#0d1209"/>
    </radialGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
