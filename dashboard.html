<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — DeskWarriorFit</title>
  <meta name="description" content="Your daily desk-warrior challenges, streak, and progress tracker.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: #0d1209;
      color: #ede8df;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; }

    /* ── Nav ── */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background-color: rgba(13,18,9,0.93);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #2d3d21;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
    }
    .nav-logo-badge {
      width: 32px; height: 32px;
      background-color: #c8f23a; border-radius: 7px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nav-logo-badge span {
      font-family: 'DM Mono', monospace; font-weight: 500;
      font-size: 13px; color: #0d1209;
    }
    .nav-logo-name {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700; font-size: 17px;
      letter-spacing: -0.02em; color: #ede8df;
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .user-email {
      font-family: 'DM Mono', monospace; font-size: 12px;
      color: #7a9464; display: none;
    }
    @media (min-width: 560px) { .user-email { display: block; } }
    .btn-logout {
      font-size: 13px; font-weight: 600;
      color: #7a9464; background: none; border: 1px solid #2d3d21;
      border-radius: 8px; padding: 7px 14px; cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-logout:hover { color: #ede8df; border-color: #7a9464; }

    /* ── Page content ── */
    .page { max-width: 1200px; margin: 0 auto; padding: clamp(32px, 5vw, 56px) 24px; }

    /* ── Greeting & date ── */
    .greeting-row {
      display: flex; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 36px;
    }
    .greeting-label {
      font-family: 'DM Mono', monospace; font-size: 11px;
      letter-spacing: 0.14em; color: #c8f23a;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .greeting-h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 900; letter-spacing: -0.025em;
      line-height: 1.05;
    }
    .today-date {
      font-family: 'DM Mono', monospace; font-size: 12px;
      color: #7a9464; text-align: right;
    }

    /* ── Stat strip ── */
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px; margin-bottom: 40px;
    }
    @media (max-width: 560px) { .stat-strip { grid-template-columns: 1fr 1fr; } }
    .stat-tile {
      background-color: #141a0f;
      border: 1px solid #2d3d21; border-radius: 14px;
      padding: 20px 18px;
    }
    .stat-tile-label {
      font-family: 'DM Mono', monospace; font-size: 10px;
      letter-spacing: 0.12em; color: #7a9464;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .stat-tile-value {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 36px; font-weight: 900;
      letter-spacing: -0.03em; line-height: 1;
      color: #c8f23a;
    }
    .stat-tile-sub {
      font-size: 12px; color: #7a9464; margin-top: 4px;
    }

    /* ── Section heading ── */
    .section-label {
      font-family: 'DM Mono', monospace; font-size: 11px;
      letter-spacing: 0.14em; color: #c8f23a;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .section-h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 900; letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    /* ── Day tabs ── */
    .week-tabs-wrap {
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; margin-bottom: 32px;
    }
    .week-tabs-wrap::-webkit-scrollbar { display: none; }
    .week-tabs {
      display: flex; gap: 8px; min-width: max-content;
    }
    .day-tab {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 18px; border-radius: 12px; cursor: pointer;
      border: 1px solid #2d3d21; background: #141a0f;
      transition: border-color 0.2s, background 0.2s;
      user-select: none; min-width: 72px;
    }
    .day-tab:hover { border-color: #4a5e35; }
    .day-tab.active { border-color: #c8f23a; background: #1e3a14; }
    .day-tab-name {
      font-family: 'DM Mono', monospace; font-size: 11px;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #7a9464; font-weight: 500;
    }
    .day-tab.active .day-tab-name,
    .day-tab.today .day-tab-name { color: #c8f23a; }
    .day-tab-date {
      font-size: 18px; font-weight: 700;
      font-family: 'Fraunces', Georgia, serif;
      color: #ede8df; line-height: 1;
    }
    .day-tab-pips { display: flex; gap: 3px; align-items: center; min-height: 6px; }
    .day-pip {
      width: 5px; height: 5px; border-radius: 50%;
      background-color: #2d3d21;
    }
    .day-pip.done { background-color: #c8f23a; }

    /* ── Challenge cards ── */
    .challenges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px; margin-bottom: 48px;
    }
    .challenge-card {
      background-color: #141a0f;
      border: 1px solid #2d3d21; border-radius: 16px;
      padding: 24px; display: flex;
      flex-direction: column; gap: 14px;
      transition: border-color 0.2s;
    }
    .challenge-card.done {
      border-color: #c8f23a;
      opacity: 0.75;
    }
    .challenge-card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .challenge-category {
      font-family: 'DM Mono', monospace; font-size: 10px;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 4px; font-weight: 500;
    }
    .cat-move    { background-color: #1e3a14; color: #c8f23a; }
    .cat-recover { background-color: #1a2e3a; color: #7ac8f2; }
    .cat-fuel    { background-color: #3a2e14; color: #f2c87a; }
    .challenge-points {
      font-family: 'DM Mono', monospace; font-size: 12px;
      color: #7a9464;
    }
    .challenge-title {
      font-size: 17px; font-weight: 700;
      letter-spacing: -0.01em; line-height: 1.3;
    }
    .challenge-desc {
      font-size: 14px; line-height: 1.65; color: #7a9464;
    }
    .complete-btn {
      align-self: flex-start;
      background-color: transparent;
      border: 1px solid #2d3d21; border-radius: 8px;
      padding: 9px 18px; font-size: 13px; font-weight: 700;
      color: #ede8df; cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
      display: flex; align-items: center; gap: 8px;
    }
    .complete-btn:hover {
      background-color: #c8f23a; border-color: #c8f23a; color: #0d1209;
    }
    .complete-btn.done {
      background-color: #1e3a14; border-color: #c8f23a; color: #c8f23a;
      cursor: default;
    }
    .complete-btn:disabled { cursor: default; }

    /* ── Recent activity ── */
    .activity-list { display: flex; flex-direction: column; gap: 12px; }
    .activity-item {
      display: flex; align-items: center; gap: 16px;
      background-color: #141a0f;
      border: 1px solid #2d3d21; border-radius: 12px;
      padding: 14px 18px;
    }
    .activity-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background-color: #c8f23a; flex-shrink: 0;
    }
    .activity-title { font-size: 14px; font-weight: 600; flex: 1; }
    .activity-time {
      font-family: 'DM Mono', monospace; font-size: 11px;
      color: #7a9464; white-space: nowrap;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      background-color: #141a0f;
      border: 1px dashed #2d3d21; border-radius: 16px;
      color: #7a9464;
    }
    .empty-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 600; color: #ede8df; margin-bottom: 6px; }

    /* ── Loading skeleton ── */
    .loading-text {
      color: #7a9464; font-family: 'DM Mono', monospace;
      font-size: 13px; padding: 32px 0;
    }
  </style>
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <div class="nav-logo-badge"><span>DW</span></div>
        <span class="nav-logo-name">DeskWarriorFit</span>
      </a>
      <div class="nav-right">
        <span class="user-email" id="userEmail"></span>
        <button class="btn-logout" onclick="handleLogout()">Log Out</button>
      </div>
    </div>
  </nav>

  <!-- ── Dashboard ── -->
  <div class="page">

    <!-- Greeting -->
    <div class="greeting-row">
      <div>
        <div class="greeting-label">Your dashboard</div>
        <h1 class="greeting-h1" id="greeting">Good morning, Warrior.</h1>
      </div>
      <div class="today-date" id="todayDate"></div>
    </div>

    <!-- Stats strip -->
    <div class="stat-strip">
      <div class="stat-tile">
        <div class="stat-tile-label">Day Streak</div>
        <div class="stat-tile-value" id="statStreak">—</div>
        <div class="stat-tile-sub">consecutive days</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Today</div>
        <div class="stat-tile-value" id="statToday">—</div>
        <div class="stat-tile-sub">challenges done</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">Total Points</div>
        <div class="stat-tile-value" id="statPoints">—</div>
        <div class="stat-tile-sub">points earned</div>
      </div>
    </div>

    <!-- Week plan -->
    <div class="section-label">Week plan</div>
    <div class="week-tabs-wrap">
      <div class="week-tabs" id="weekTabs"></div>
    </div>
    <h2 class="section-h2" id="challengeHeading">Loading…</h2>
    <div class="challenges-grid" id="challengesGrid">
      <p class="loading-text">Fetching your challenges…</p>
    </div>

    <!-- Recent activity -->
    <div id="recentSection" style="display:none">
      <div class="section-label">Recent activity</div>
      <div class="activity-list" id="activityList"></div>
    </div>

  </div>

  <script>
    window.SUPABASE_URL = 'https://pmnmejhkoxqlvzxzuaag.supabase.co';
    window.SUPABASE_ANON_KEY = 'sb_publishable_HweWmPaMtvEdsklGjnLg2Q_cjEx-Uud';
    window.API_BASE = 'https://pmnmejhkoxqlvzxzuaag.supabase.co/functions/v1';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = window.supabase;
    const sb = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const todayDow = new Date().getDay(); // 0–6

    let allChallenges = {};   // keyed by day_of_week
    let completedIds = new Set();  // all-time completed challenge IDs
    let todayCompletedIds = new Set(); // today's completed challenge IDs
    let allProgress = [];
    let activeDow = todayDow;

    // ── Auth guard ──
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = '/auth.html'; return; }

      document.getElementById('userEmail').textContent = session.user.email;
      setGreeting();
      setDate();
      await Promise.all([loadProgress(), loadAllChallenges()]);
      renderWeekTabs();
      renderDay(activeDow);
    }

    function setGreeting() {
      const h = new Date().getHours();
      const t = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
      document.getElementById('greeting').textContent = `Good ${t}, Warrior.`;
    }

    function setDate() {
      const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('todayDate').textContent =
        new Date().toLocaleDateString('en-GB', opts);
    }

    // ── Load user progress ──
    async function loadProgress() {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(window.API_BASE + '/progress', {
        headers: { Authorization: 'Bearer ' + session.access_token },
      });
      if (!res.ok) return;
      const { progress, streak } = await res.json();
      allProgress = progress || [];

      document.getElementById('statStreak').textContent = streak;

      const today = new Date().toISOString().split('T')[0];
      allProgress.forEach(r => {
        completedIds.add(r.challenge_id);
        if (r.completed_at.startsWith(today)) todayCompletedIds.add(r.challenge_id);
      });

      document.getElementById('statToday').textContent = todayCompletedIds.size;

      const totalPoints = allProgress.reduce((s, r) => s + (r.challenges?.points || 0), 0);
      document.getElementById('statPoints').textContent = totalPoints;

      // Recent activity
      const recent = allProgress.slice(0, 10);
      if (recent.length) {
        document.getElementById('recentSection').style.display = '';
        document.getElementById('activityList').innerHTML = recent.map(r => `
          <div class="activity-item">
            <div class="activity-dot"></div>
            <span class="activity-title">${escHtml(r.challenges?.title || 'Challenge')}</span>
            <span class="activity-time">${formatRelativeTime(new Date(r.completed_at))}</span>
          </div>`).join('');
      }
    }

    // ── Load ALL challenges (all days) ──
    async function loadAllChallenges() {
      const res = await fetch(window.API_BASE + '/challenges');
      if (!res.ok) return;
      const { challenges } = await res.json();
      // Group by day_of_week
      for (let d = 0; d <= 6; d++) allChallenges[d] = [];
      (challenges || []).forEach(c => {
        if (allChallenges[c.day_of_week] !== undefined)
          allChallenges[c.day_of_week].push(c);
      });
    }

    // ── Build week tab bar ──
    function renderWeekTabs() {
      // Build a Mon→Sun order starting from today's week
      // Show Mon(1)→Sun(0) so week reads naturally
      const orderedDows = [1, 2, 3, 4, 5, 6, 0];
      const today = new Date();

      const tabs = document.getElementById('weekTabs');
      tabs.innerHTML = orderedDows.map(dow => {
        // Find the date of this dow in the current week (week starts Monday)
        const diff = dow === 0 ? (7 - today.getDay()) % 7 || 7 : dow - today.getDay();
        // Simpler: just show day number relative to today's week
        const d = new Date(today);
        const dayOffset = (dow - today.getDay() + 7) % 7;
        // For today itself offset = 0; others may go in future
        // We want to show the current week's Mon-Sun
        const weekMonday = new Date(today);
        weekMonday.setDate(today.getDate() - ((today.getDay() + 6) % 7)); // Monday of this week
        const dayDate = new Date(weekMonday);
        dayDate.setDate(weekMonday.getDate() + (dow === 0 ? 6 : dow - 1));

        const challenges = allChallenges[dow] || [];
        const doneCount = challenges.filter(c => {
          // For today, use todayCompletedIds; for past days check completedIds with date
          if (dow === todayDow) return todayCompletedIds.has(c.id);
          const dateStr = dayDate.toISOString().split('T')[0];
          return allProgress.some(r => r.challenge_id === c.id && r.completed_at.startsWith(dateStr));
        }).length;

        const isToday = dow === todayDow;
        const isActive = dow === activeDow;
        const dateNum = dayDate.getDate();

        const pips = challenges.map((_, i) =>
          `<div class="day-pip${i < doneCount ? ' done' : ''}"></div>`
        ).join('');

        return `<div class="day-tab${isToday ? ' today' : ''}${isActive ? ' active' : ''}"
          onclick="switchDay(${dow})" data-dow="${dow}">
          <div class="day-tab-name">${DAY_NAMES[dow]}</div>
          <div class="day-tab-date">${dateNum}</div>
          <div class="day-tab-pips">${pips}</div>
        </div>`;
      }).join('');

      // Scroll active tab into view
      const activeEl = tabs.querySelector('.day-tab.active');
      if (activeEl) activeEl.scrollIntoView({ inline: 'center', block: 'nearest' });
    }

    // ── Switch to a day ──
    function switchDay(dow) {
      activeDow = dow;
      document.querySelectorAll('.day-tab').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.dow) === dow);
      });
      renderDay(dow);
    }

    // ── Render challenges for a given day ──
    function renderDay(dow) {
      const challenges = allChallenges[dow] || [];
      const isToday = dow === todayDow;
      const dayName = DAY_NAMES[dow] === 'Sun' ? 'Sunday' :
        ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][dow];

      // Work out the date string for this day to check past completions
      const today = new Date();
      const weekMonday = new Date(today);
      weekMonday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
      const dayDate = new Date(weekMonday);
      dayDate.setDate(weekMonday.getDate() + (dow === 0 ? 6 : dow - 1));
      const dateStr = dayDate.toISOString().split('T')[0];

      const heading = document.getElementById('challengeHeading');
      const grid = document.getElementById('challengesGrid');

      if (!challenges.length) {
        heading.textContent = isToday ? 'Rest day — well earned.' : `Rest day on ${dayName}.`;
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">😴</div>
            <div class="empty-title">No challenges ${isToday ? 'today' : 'this day'}</div>
            <p>${isToday ? 'Today is your rest day. Stay hydrated and get good sleep.' : `${dayName} is a rest day.`}</p>
          </div>`;
        return;
      }

      heading.textContent = isToday ? `Today's challenges` : `${dayName}'s challenges`;

      grid.innerHTML = challenges.map(c => {
        const done = isToday
          ? todayCompletedIds.has(c.id)
          : allProgress.some(r => r.challenge_id === c.id && r.completed_at.startsWith(dateStr));

        return `
          <div class="challenge-card ${done ? 'done' : ''}" id="card-${c.id}">
            <div class="challenge-card-top">
              <span class="challenge-category cat-${c.category}">${c.category}</span>
              <span class="challenge-points">+${c.points} pts</span>
            </div>
            <div class="challenge-title">${escHtml(c.title)}</div>
            <div class="challenge-desc">${escHtml(c.description || '')}</div>
            ${isToday ? `<button
              class="complete-btn ${done ? 'done' : ''}"
              id="btn-${c.id}"
              onclick="markComplete('${c.id}', ${c.points})"
              ${done ? 'disabled' : ''}
            >${done ? '✓ Done' : 'Mark complete'}</button>` : done ? `<span style="font-family:'DM Mono',monospace;font-size:12px;color:#c8f23a;">✓ Completed</span>` : ''}
          </div>`;
      }).join('');
    }

    // ── Mark a challenge complete ──
    async function markComplete(challengeId, points) {
      const btn = document.getElementById(`btn-${challengeId}`);
      btn.disabled = true;
      btn.textContent = 'Saving…';

      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(window.API_BASE + '/progress', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ challenge_id: challengeId }),
      });

      if (res.ok || res.status === 409) {
        todayCompletedIds.add(challengeId);
        completedIds.add(challengeId);
        btn.textContent = '✓ Done';
        btn.classList.add('done');
        document.getElementById(`card-${challengeId}`).classList.add('done');

        document.getElementById('statToday').textContent = todayCompletedIds.size;
        if (res.ok) {
          const el = document.getElementById('statPoints');
          el.textContent = parseInt(el.textContent || '0', 10) + points;
        }
        renderWeekTabs(); // refresh pips
      } else {
        btn.disabled = false;
        btn.textContent = 'Try again';
      }
    }

    // ── Logout ──
    async function handleLogout() {
      await sb.auth.signOut();
      window.location.href = '/';
    }

    // ── Helpers ──
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatRelativeTime(date) {
      const m = Math.round((Date.now() - date.getTime()) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m}m ago`;
      const h = Math.round(m / 60);
      if (h < 24) return `${h}h ago`;
      return `${Math.round(h / 24)}d ago`;
    }

    init();
  </script>

</body>
</html>
